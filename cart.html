<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart | RAB Watch Dealers</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <div class="logo">RAB Watch Dealers</div>
  <div class="menu-toggle" id="menuToggle">☰</div>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html">HOME</a></li>
    <li><a href="products.html">PRODUCTS</a></li>
    <li><a href="contactus.html">CONTACT</a></li>
    <li><a href="about.html">ABOUT</a></li>
    <li>
      <a href="cart.html">Cart <span id="cartCount">0</span></a>
    </li>
  </ul>
</nav>

<section class="page-header fade">
  <h1>Your Cart</h1>
</section>

<section class="cart-container">
  <div id="cartItems">
   
  </div>
  <div class="cart-total">
    <h3>Total: KES <span id="cartTotal">0</span></h3>
  </div>
  <button id="checkoutBtn" class="checkout">Checkout via WhatsApp</button>
  <button id="clearCart" class="clear-cart-btn">Clear Cart</button>
</section>

<script>
  const cartItemsContainer = document.getElementById("cartItems");
  const cartCountElem = document.getElementById("cartCount");
  const cartTotalElem = document.getElementById("cartTotal");
  const clearCartBtn = document.getElementById("clearCart");

  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  function renderCart() {
    cartItemsContainer.innerHTML = "";
    if (cart.length === 0) {
      cartItemsContainer.innerHTML = "<p>Your cart is empty.</p>";
      cartTotalElem.innerText = "0";
      cartCountElem.innerText = "0";
      return;
    }

    let total = 0;
    cart.forEach((item, index) => {
      total += item.price * item.qty;
      const itemElem = document.createElement("div");
      itemElem.classList.add("cart-item");
      itemElem.innerHTML = `
        <img src="${item.img}" alt="${item.name}">
        <div class="item-details">
          <h4>${item.name}</h4>
          <p>KES ${item.price}</p>
          <p>Quantity: ${item.qty}</p>
          <button class="remove-item" data-index="${index}">Remove</button>
        </div>
      `;
      cartItemsContainer.appendChild(itemElem);
    });

    cartTotalElem.innerText = total.toLocaleString();
    cartCountElem.innerText = cart.reduce((sum, item) => sum + item.qty, 0);


    document.querySelectorAll(".remove-item").forEach(btn => {
      btn.addEventListener("click", () => {
        const idx = btn.dataset.index;
        cart.splice(idx, 1);
        localStorage.setItem("cart", JSON.stringify(cart));
        renderCart();
      });
    });
  }

  clearCartBtn.addEventListener("click", () => {
    cart = [];
    localStorage.setItem("cart", JSON.stringify(cart));
    renderCart();
  });

  renderCart();

  
  const menuToggle = document.getElementById("menuToggle");
  const navLinks = document.getElementById("navLinks");
  menuToggle.addEventListener("click", () => navLinks.classList.toggle("show"));
</script>
<button id="checkoutBtn">Checkout via WhatsApp</button>

<script>
document.getElementById("checkoutBtn").addEventListener("click", () => {

  const cart = JSON.parse(localStorage.getItem("cart")) || [];
  if (cart.length === 0) return alert("Your cart is empty");

  let message = "Hello RAB Watch Dealers%0A%0A";
  message += "I would like to place an order:%0A%0A";

  let total = 0;

  cart.forEach(item => {
    message += `• ${item.name} (x${item.qty}) - KES ${item.price}%0A`;
    total += item.price * item.qty;
  });

  message += `%0ATotal: KES ${total.toLocaleString()}%0A%0APlease confirm availability.`;

  window.open(`https://wa.me/254742184483?text=${message}`);
});
</script>


</body>
</html>
