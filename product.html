<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Details | RAB Watch Dealers</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .product-container {
      max-width: 900px;
      margin: 80px auto;
      text-align: center;
      padding: 20px;
    }

    .back-btn {
      display: inline-block;
      margin-bottom: 30px;
      text-decoration: none;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #ff8c1a 0%, #ffb347 100%);
      padding: 14px 32px;
      border-radius: 40px;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(255, 140, 26, 0.3);
      letter-spacing: 0.5px;
      position: relative;
      overflow: hidden;
    }

    .back-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.2);
      transition: left 0.5s ease;
      z-index: 0;
    }

    .back-btn:hover::before {
      left: 100%;
    }

    .back-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(255, 140, 26, 0.5);
      background: linear-gradient(135deg, #ffb347 0%, #ff8c1a 100%);
    }

    .product-name {
      font-size: 2rem;
      margin: 10px 0;
    }

    .tagline {
      font-style: italic;
      color: #555;
      margin-bottom: 20px;
    }

    .product-img {
      width: 100%;
      max-width: 450px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .price {
      font-size: 22px;
      color: #c49a3a;
      margin-bottom: 15px;
    }

    .product-desc {
      color: #444;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .btn {
      background: black;
      color: white;
      padding: 12px 20px;
      border-radius: 6px;
      text-decoration: none;
    }

    @media(max-width:768px) {
      .product-img { width: 80%; }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<nav class="navbar" id="navbar">
  <div class="logo">RAB WATCH</div>
  <div class="menu-toggle" id="menuToggle">☰</div>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html">HOME</a></li>
    <li><a href="products.html">PRODUCTS</a></li>
    <li><a href="men.html">MEN</a></li>
    <li><a href="women.html">WOMEN</a></li>
    <li><a href="contactus.html">CONTACT</a></li>
    <li><a href="about.html">ABOUT</a></li>
    <li><a href="cart.html">🛒 Cart <span id="cartCount">0</span></a></li>
  </ul>
</nav>

<section class="product-container">
  <!-- Back button -->
  <a href="products.html" class="back-btn">⬅ Back to Watches</a>

  <!-- Product Image -->
  <img id="productImg" class="product-img" src="" alt="Product Image" style="max-width: 500px; margin: 30px auto; display: block; border-radius: 12px;">

  <!-- Product Title -->
  <h1 class="product-name" id="productName">Watch Name</h1>

  <!-- Slogan / tagline -->
  <p class="tagline">Wear Time. Wear Confidence.</p>

  <!-- Price -->
  <p class="price" id="productPrice">KES 0</p>

  <!-- Description -->
  <p class="product-desc">
    Premium luxury timepiece from RAB Watch Dealers. Built for style, precision, and durability.
  </p>

  <!-- Add to Cart Button -->
  <button id="addToCartBtn" class="cta-btn" style="margin-top: 20px; padding: 16px 50px; font-size: 1.1rem;">🛒 Add to Cart</button>

</section>

<script>
  // Navbar scroll effect
  const navbar = document.getElementById('navbar');
  window.addEventListener('scroll', () => {
    if (window.scrollY > 50) {
      navbar.classList.add('scrolled');
    } else {
      navbar.classList.remove('scrolled');
    }
  });

  // Menu toggle
  const menuToggle = document.getElementById("menuToggle");
  const navLinks = document.getElementById("navLinks");

  menuToggle.addEventListener("click", () => {
    navLinks.classList.toggle("show");
    menuToggle.textContent = navLinks.classList.contains("show") ? "✕" : "☰";
  });

  document.querySelectorAll(".nav-links a").forEach(link => {
    link.addEventListener("click", () => {
      navLinks.classList.remove("show");
      menuToggle.textContent = "☰";
    });
  });

  // Dropdown menu functionality
  document.querySelectorAll(".dropdown-toggle").forEach(toggle => {
    toggle.addEventListener("click", (e) => {
      e.preventDefault();
    });
  });

  // Product details
  const params = new URLSearchParams(window.location.search);
  const name = params.get("name");
  const price = params.get("price");
  const img = params.get("img");

  document.getElementById("productName").textContent = name || "Watch";
  document.getElementById("productPrice").textContent = price ? "KES " + price : "";
  document.getElementById("productImg").src = img ? "images/" + img : "images/placeholder.jpg";

  // Cart functionality
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  updateCartCount();

  const addToCartBtn = document.getElementById("addToCartBtn");
  addToCartBtn.addEventListener("click", () => {
    if (!name || !price) {
      alert("Product information not found");
      return;
    }

    const item = {
      name: name,
      price: price,
      img: img,
      qty: 1
    };

    const existing = cart.find(p => p.name === item.name);
    if (existing) existing.qty++;
    else cart.push(item);

    localStorage.setItem("cart", JSON.stringify(cart));
    updateCartCount();

    // Show notification
    addToCartBtn.textContent = "✓ Added to Cart!";
    addToCartBtn.style.opacity = "0.7";
    setTimeout(() => {
      addToCartBtn.textContent = "🛒 Add to Cart";
      addToCartBtn.style.opacity = "1";
    }, 2000);
  });

  function updateCartCount() {
    const count = cart.reduce((sum, item) => sum + item.qty, 0);
    const countElement = document.getElementById("cartCount");
    if (countElement) countElement.innerText = count;
  }
</script>

</body>
</html>
